# GENERATED by shared/infra/generate_infra.py - edit APPS there, not this file.
# Single public entry point. Everything is same-origin, so the auth cookie is
# HttpOnly and no CORS is needed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Brute-force guard for credential endpoints (the backends also throttle).
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- center: the prefix is stripped before reaching the service ---
    location /api/center/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://center-backend:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/center/ {
        proxy_pass http://center-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- app APIs ---
    location /api/chat/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://chat-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/photos/ {
        client_max_body_size 6m;
        proxy_pass http://photos-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/watch/ {
        client_max_body_size 110m;
        proxy_request_buffering off;  # stream uploads to the backend
        proxy_buffering off;          # stream video ranges back
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://watch-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/werewolf/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass http://werewolf-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/market/ {
        proxy_pass http://market-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/learning/ {
        proxy_pass http://learning-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/jobs/ {
        proxy_pass http://jobs-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- app frontends (each served under /<slug>) ---
    location ~ ^/chat(/|$) {
        proxy_pass http://chat-frontend:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/photos(/|$) {
        proxy_pass http://photos-frontend:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/watch(/|$) {
        proxy_pass http://watch-frontend:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/werewolf(/|$) {
        proxy_pass http://werewolf-frontend:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/market(/|$) {
        proxy_pass http://market-frontend:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/learning(/|$) {
        proxy_pass http://learning-frontend:3000;
        proxy_set_header Host $host;
    }

    location ~ ^/jobs(/|$) {
        proxy_pass http://jobs-frontend:3000;
        proxy_set_header Host $host;
    }

    # --- shell (center frontend) ---
    location / {
        proxy_pass http://center-frontend:3000;
        proxy_set_header Host $host;
    }
}
