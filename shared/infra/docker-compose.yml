name: socialnetwork

# Run from the repo root:
#   docker compose --env-file .env -f shared/infra/docker-compose.yml up --build

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-backend-env: &backend-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  center-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: center/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/center
    depends_on:
      postgres:
        condition: service_healthy

  chat-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: chat/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/chat
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

  center-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: center/frontend/Dockerfile

  chat-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: chat/frontend/Dockerfile

  gateway:
    <<: *hardening
    # nginx needs CHOWN/SETUID/SETGID/NET_BIND_SERVICE at start-up; keep its
    # default capabilities instead of guessing the minimal set untested.
    cap_drop: []
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - center-backend
      - chat-backend
      - center-frontend
      - chat-frontend

volumes:
  pgdata:
