name: socialnetwork

# GENERATED by shared/infra/generate_infra.py - edit APPS there, not this file.
# Run from the repo root:
#   docker compose --env-file .env -f shared/infra/docker-compose.yml up --build

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-backend-env: &backend-env
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared throttle counters and single-use challenge markers (center REDIS_URL). Internal network only,
  # nothing persisted: every key has a TTL; noeviction (writes fail rather than dropping a revocation) so monitor memory.
  redis:
    image: redis:7-alpine
    user: redis  # already unprivileged: the entrypoint then skips its setuid step, which cap_drop ALL forbids
    <<: *hardening
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  center-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: center/backend/Dockerfile
      args:
        WITH_BIOMETRICS: ${WITH_BIOMETRICS:-0}
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/center
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      REFRESH_DAYS: ${REFRESH_DAYS:-14}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BIOMETRICS_ENABLED: ${BIOMETRICS_ENABLED:-0}
      DATA_KEY: ${DATA_KEY:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Mạng xã hội}
      PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Mạng xã hội <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-0}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  center-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: center/frontend/Dockerfile

  chat-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: chat/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/chat
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: chat/frontend/Dockerfile

  photos-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: photos/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/photos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - photos-data:/data
    tmpfs:
      - /tmp:size=128m

  photos-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: photos/frontend/Dockerfile

  watch-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: watch/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/watch
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - watch-data:/data
    tmpfs:
      - /tmp:size=512m

  watch-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: watch/frontend/Dockerfile

  werewolf-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: werewolf/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/werewolf
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  werewolf-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: werewolf/frontend/Dockerfile

  market-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: market/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/market
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: market/frontend/Dockerfile

  learning-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: learning/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/learning
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  learning-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: learning/frontend/Dockerfile

  jobs-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: jobs/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/jobs
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: jobs/frontend/Dockerfile

  # Development mail sink: catches every email the app sends (nothing leaves this machine).
  # Enabled by COMPOSE_PROFILES=mail-dev in .env; in production point SMTP_* at a real server instead.
  # Web inbox: http://localhost:8025 (bound to this machine only).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"

  gateway:
    <<: *hardening
    # nginx needs CHOWN/SETUID/SETGID/NET_BIND_SERVICE at start-up; keep its
    # default capabilities instead of guessing the minimal set untested.
    cap_drop: []
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - center-backend
      - center-frontend
      - chat-backend
      - chat-frontend
      - photos-backend
      - photos-frontend
      - watch-backend
      - watch-frontend
      - werewolf-backend
      - werewolf-frontend
      - market-backend
      - market-frontend
      - learning-backend
      - learning-frontend
      - jobs-backend
      - jobs-frontend

volumes:
  pgdata:
  photos-data:
  watch-data:
