name: socialnetwork

# GENERATED by shared/infra/generate_infra.py - edit APPS there, not this file.
# Run from the repo root:
#   docker compose --env-file .env -f shared/infra/docker-compose.yml up --build

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Shared by every backend. JWT_SECRET is deliberately NOT here: only the process that hosts the center gets it.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  COOKIE_SECURE: ${COOKIE_SECURE:-1}
  ORDER_DISCOUNT_PERCENT: ${ORDER_DISCOUNT_PERCENT:-0}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # The superuser password lives on this service only; each service connects as its own role.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_PASSWORD_APP: ${DB_PASSWORD_APP:?set DB_PASSWORD_APP in .env (hex)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on a FRESH volume only; on an existing one use postgres/apply-roles.sh (see README).
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared throttle counters and single-use challenge markers (center REDIS_URL). Internal network only,
  # nothing persisted: every key has a TTL; noeviction (writes fail rather than dropping a revocation) so monitor memory.
  redis:
    image: redis:7-alpine
    user: redis  # already unprivileged: the entrypoint then skips its setuid step, which cap_drop ALL forbids
    <<: *hardening
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # The pages of every app in ONE Next app (frontend): the center at the root, each other app under /<slug>.
  web-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: frontend/Dockerfile

  api-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        WITH_BIOMETRICS: ${WITH_BIOMETRICS:-0}
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_app:${DB_PASSWORD_APP:?set DB_PASSWORD_APP in .env (hex)}@postgres:5432/app
      JWT_PUBLIC_KEYS_FILE: "/run/secrets/jwt_public_keys"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      ALLOWED_ORIGINS: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "${RABBITMQ_USER:-sn}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (hex)}"
      KAFKA_BOOTSTRAP: "kafka:9092"
      RECORDS_DATA_DIR: "/data/records"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env (32+ characters, center only)}"
      JWT_PRIVATE_KEY_FILE: "/run/secrets/jwt_private_key"
      JWT_KEY_ID: "${JWT_KEY_ID:-}"
      APP_ENV: "${APP_ENV:-development}"
      ACCESS_TOKEN_MINUTES: "${ACCESS_TOKEN_MINUTES:-60}"
      REFRESH_DAYS: "${REFRESH_DAYS:-14}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      BIOMETRICS_ENABLED: "${BIOMETRICS_ENABLED:-0}"
      DATA_KEY: "${DATA_KEY:-}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-}"
      WEBAUTHN_RP_NAME: "${WEBAUTHN_RP_NAME:-Mạng xã hội}"
      PUBLIC_URL: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Mạng xã hội <no-reply@localhost>}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-0}"
      SMTP_SSL: "${SMTP_SSL:-0}"
      SMTP_ALLOW_PLAINTEXT_AUTH: "${SMTP_ALLOW_PLAINTEXT_AUTH:-0}"
      SMS_PROVIDER: "${SMS_PROVIDER:-}"
      SMS_DAILY_CAP: "${SMS_DAILY_CAP:-500}"
      SMS_ALLOWED_PREFIXES: "${SMS_ALLOWED_PREFIXES:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM: "${TWILIO_FROM:-}"
      LIVEKIT_URL: "${LIVEKIT_URL:-ws://localhost:7880}"
      LIVEKIT_HTTP: "http://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      CALLEAR_URL: "http://callear:8200"
      CALLEAR_SECRET: "${CALLEAR_SECRET:-}"
      AI_PROVIDER: "${AI_PROVIDER:-dummy}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}"
      WEREWOLF_SECRET: "${WEREWOLF_SECRET:-}"
      CHAT_CLUSTER: "${CHAT_CLUSTER:-}"
      WEREWOLF_URL: "http://127.0.0.1:8000/werewolf"
      CHAT_URL: "http://127.0.0.1:8000/chat"
      WEREWOLF_SNAPSHOT_KEY: "${WEREWOLF_SNAPSHOT_KEY:-}"
      FILE_DATA_DIR: "/data/file"
      RALLY_MODEL_PATH: "/data/models/yolov8n.onnx"
      RALLY_UPLOAD_DIR: "/data/rally"
    secrets:
      - jwt_private_key
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../backend/data:/data
    tmpfs:
      - /tmp:size=64m

  # The worker of the backend (same image as api-backend): one consumer per queue declared in api/worker.py (touches /tmp/worker-alive).
  api-worker:
    <<: *hardening
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "api.worker"]
    profiles: ["messaging"]
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "${RABBITMQ_USER:-sn}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (hex)}"
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      api-backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/worker-alive -mmin -1 2>/dev/null)\""]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Work queue broker. Management UI: http://localhost:15672 (user RABBITMQ_USER).
  rabbitmq:
    <<: *hardening
    cap_drop: []
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-sn}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (hex)}"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Single-node KRaft broker (no ZooKeeper), PLAINTEXT on the internal network only, not published.
  kafka:
    <<: *hardening
    image: apache/kafka:3.9.0
    profiles: ["messaging"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "52428800"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "60000"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # LiveKit: the video of the calls of the rooms. The browsers reach it at ws://localhost:7880 and send the media to 7881 (TCP) and 7882 (UDP).
  livekit:
    <<: *hardening
    image: livekit/livekit-server:v1.13.11
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_CONFIG: "{port: 7880, log_level: info, rtc: {tcp_port: 7881, udp_port: 7882, use_external_ip: false, node_ip: 127.0.0.1}, keys: {${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (hex)}}}"

  # The ear of the calls: listens to the microphones in a call (a hidden listener of LiveKit) and hands what each person says to the chat.
  callear:
    <<: *hardening
    build:
      context: ./callear
    environment:
      CALLEAR_SECRET: "${CALLEAR_SECRET:?set CALLEAR_SECRET in .env (hex)}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-}"
      LIVEKIT_INTERNAL_URL: "ws://livekit:7880"
      CHAT_INTERNAL_URL: "http://api-backend:8000/chat"
    depends_on:
      livekit:
        condition: service_started
      api-backend:
        condition: service_healthy

  # Development mail sink: catches every email the app sends (nothing leaves this machine).
  # Enabled by COMPOSE_PROFILES=mail-dev in .env; in production point SMTP_* at a real server instead.
  # Web inbox: http://localhost:8025 (bound to this machine only).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"

  gateway:
    <<: *hardening
    # nginx needs CHOWN/SETUID/SETGID/NET_BIND_SERVICE at start-up; keep its
    # default capabilities instead of guessing the minimal set untested.
    cap_drop: []
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-frontend
      - api-backend

# Access-token keys (Ed25519). Create with `python -m app.cli gen-jwt-key` in center/backend (see README);
# the files are NOT in the repository. Only the backend that hosts the center gets the private key.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_keys:
    file: ./secrets/jwt_public_keys.pem

volumes:
  pgdata:
