name: socialnetwork

# GENERATED by shared/infra/generate_infra.py - edit APPS there, not this file.
# Run from the repo root:
#   docker compose --env-file .env -f shared/infra/docker-compose.yml up --build

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

# Shared by every backend. JWT_SECRET is deliberately NOT here: it stays on center-backend alone.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # The superuser password lives on this service only; each service connects as its own role.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DB_PASSWORD_CENTER: ${DB_PASSWORD_CENTER:?set DB_PASSWORD_CENTER in .env (hex)}
      DB_PASSWORD_CHAT: ${DB_PASSWORD_CHAT:?set DB_PASSWORD_CHAT in .env (hex)}
      DB_PASSWORD_PHOTOS: ${DB_PASSWORD_PHOTOS:?set DB_PASSWORD_PHOTOS in .env (hex)}
      DB_PASSWORD_WATCH: ${DB_PASSWORD_WATCH:?set DB_PASSWORD_WATCH in .env (hex)}
      DB_PASSWORD_WEREWOLF: ${DB_PASSWORD_WEREWOLF:?set DB_PASSWORD_WEREWOLF in .env (hex)}
      DB_PASSWORD_MARKET: ${DB_PASSWORD_MARKET:?set DB_PASSWORD_MARKET in .env (hex)}
      DB_PASSWORD_LEARNING: ${DB_PASSWORD_LEARNING:?set DB_PASSWORD_LEARNING in .env (hex)}
      DB_PASSWORD_JOBS: ${DB_PASSWORD_JOBS:?set DB_PASSWORD_JOBS in .env (hex)}
      DB_PASSWORD_FACE: ${DB_PASSWORD_FACE:?set DB_PASSWORD_FACE in .env (hex)}
      DB_PASSWORD_LAB: ${DB_PASSWORD_LAB:?set DB_PASSWORD_LAB in .env (hex)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on a FRESH volume only; on an existing one use postgres/apply-roles.sh (see README).
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared throttle counters and single-use challenge markers (center REDIS_URL). Internal network only,
  # nothing persisted: every key has a TTL; noeviction (writes fail rather than dropping a revocation) so monitor memory.
  redis:
    image: redis:7-alpine
    user: redis  # already unprivileged: the entrypoint then skips its setuid step, which cap_drop ALL forbids
    <<: *hardening
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  center-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: center/backend/Dockerfile
      args:
        WITH_BIOMETRICS: ${WITH_BIOMETRICS:-0}
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_center:${DB_PASSWORD_CENTER:?set DB_PASSWORD_CENTER in .env (hex)}@postgres:5432/center
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters, center only)}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      JWT_KEY_ID: ${JWT_KEY_ID:-}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      REFRESH_DAYS: ${REFRESH_DAYS:-14}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BIOMETRICS_ENABLED: ${BIOMETRICS_ENABLED:-0}
      DATA_KEY: ${DATA_KEY:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Mạng xã hội}
      PUBLIC_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Mạng xã hội <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-0}
      SMTP_SSL: ${SMTP_SSL:-0}
      SMTP_ALLOW_PLAINTEXT_AUTH: ${SMTP_ALLOW_PLAINTEXT_AUTH:-0}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_DAILY_CAP: ${SMS_DAILY_CAP:-500}
      SMS_ALLOWED_PREFIXES: ${SMS_ALLOWED_PREFIXES:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_private_key
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  center-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: center/frontend/Dockerfile

  chat-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: chat/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_chat:${DB_PASSWORD_CHAT:?set DB_PASSWORD_CHAT in .env (hex)}@postgres:5432/chat
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: chat/frontend/Dockerfile

  photos-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: photos/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_photos:${DB_PASSWORD_PHOTOS:?set DB_PASSWORD_PHOTOS in .env (hex)}@postgres:5432/photos
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - photos-data:/data
    tmpfs:
      - /tmp:size=128m

  photos-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: photos/frontend/Dockerfile

  watch-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: watch/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_watch:${DB_PASSWORD_WATCH:?set DB_PASSWORD_WATCH in .env (hex)}@postgres:5432/watch
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - watch-data:/data
    tmpfs:
      - /tmp:size=512m

  watch-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: watch/frontend/Dockerfile

  werewolf-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: werewolf/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_werewolf:${DB_PASSWORD_WEREWOLF:?set DB_PASSWORD_WEREWOLF in .env (hex)}@postgres:5432/werewolf
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  werewolf-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: werewolf/frontend/Dockerfile

  market-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: market/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_market:${DB_PASSWORD_MARKET:?set DB_PASSWORD_MARKET in .env (hex)}@postgres:5432/market
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  market-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: market/frontend/Dockerfile

  learning-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: learning/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_learning:${DB_PASSWORD_LEARNING:?set DB_PASSWORD_LEARNING in .env (hex)}@postgres:5432/learning
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  learning-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: learning/frontend/Dockerfile

  jobs-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: jobs/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_jobs:${DB_PASSWORD_JOBS:?set DB_PASSWORD_JOBS in .env (hex)}@postgres:5432/jobs
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: jobs/frontend/Dockerfile

  face-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: face/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_face:${DB_PASSWORD_FACE:?set DB_PASSWORD_FACE in .env (hex)}@postgres:5432/face
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  face-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: face/frontend/Dockerfile

  lab-backend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: lab/backend/Dockerfile
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://sn_lab:${DB_PASSWORD_LAB:?set DB_PASSWORD_LAB in .env (hex)}@postgres:5432/lab
      JWT_PUBLIC_KEYS_FILE: /run/secrets/jwt_public_keys
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GRPC_USER_TARGET: "lab-user:50051"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "${RABBITMQ_USER:-lab}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (hex)}"
      KAFKA_BOOTSTRAP: "kafka:9092"
    secrets:
      - jwt_public_keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      lab-user:
        condition: service_started

  lab-frontend:
    <<: *hardening
    build:
      context: ../..
      dockerfile: lab/frontend/Dockerfile

  # gRPC user directory (fixed demo data). Internal network only: no ports, no database, no secrets.
  lab-user:
    <<: *hardening
    build:
      context: ../..
      dockerfile: lab/backend/Dockerfile
    command: ["python", "-m", "app.user_server"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 50051), 2)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 0s

  # RabbitMQ notification consumer + Kafka log writer in one process (touches /tmp/worker-alive).
  lab-worker:
    <<: *hardening
    build:
      context: ../..
      dockerfile: lab/backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    profiles: ["messaging"]
    environment:
      DATABASE_URL: "postgresql+psycopg://sn_lab:${DB_PASSWORD_LAB:?set DB_PASSWORD_LAB in .env (hex)}@postgres:5432/lab"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_USER: "${RABBITMQ_USER:-lab}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (hex)}"
      KAFKA_BOOTSTRAP: "kafka:9092"
    depends_on:
      postgres:
        condition: service_healthy
      lab-backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/worker-alive -mmin -1 2>/dev/null)\""]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  # Work queue broker. Management UI: http://localhost:15672 (user RABBITMQ_USER).
  rabbitmq:
    <<: *hardening
    cap_drop: []
    image: rabbitmq:4-management-alpine
    profiles: ["messaging"]
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-lab}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (hex)}"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Single-node KRaft broker (no ZooKeeper), PLAINTEXT on the internal network only, not published.
  kafka:
    <<: *hardening
    image: apache/kafka:3.9.0
    profiles: ["messaging"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_LOG_RETENTION_BYTES: "52428800"
      KAFKA_LOG_SEGMENT_BYTES: "16777216"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "60000"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Development mail sink: catches every email the app sends (nothing leaves this machine).
  # Enabled by COMPOSE_PROFILES=mail-dev in .env; in production point SMTP_* at a real server instead.
  # Web inbox: http://localhost:8025 (bound to this machine only).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail-dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "500"

  gateway:
    <<: *hardening
    # nginx needs CHOWN/SETUID/SETGID/NET_BIND_SERVICE at start-up; keep its
    # default capabilities instead of guessing the minimal set untested.
    cap_drop: []
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - center-backend
      - center-frontend
      - chat-backend
      - chat-frontend
      - photos-backend
      - photos-frontend
      - watch-backend
      - watch-frontend
      - werewolf-backend
      - werewolf-frontend
      - market-backend
      - market-frontend
      - learning-backend
      - learning-frontend
      - jobs-backend
      - jobs-frontend
      - face-backend
      - face-frontend
      - lab-backend
      - lab-frontend

# Access-token keys (Ed25519). Create with `python -m app.cli gen-jwt-key` in center/backend (see README);
# the files are NOT in the repository. Only center-backend gets the private key.
secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_keys:
    file: ./secrets/jwt_public_keys.pem

volumes:
  pgdata:
  photos-data:
  watch-data:
